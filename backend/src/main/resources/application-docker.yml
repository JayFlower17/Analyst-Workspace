server:
  port: 8080

spring:
  application:
    name: data-analysis-platform
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:dummy-deepseek-key}
      base-url: https://api.deepseek.com
      chat:
        api-key: ${DEEPSEEK_API_KEY:dummy-deepseek-key}
        options:
          model: deepseek-chat
          temperature: 0.3

      embedding:
        api-key: ${DASHSCOPE_API_KEY:dummy-dashscope-key}
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        options:
          model: text-embedding-v4
          dimensions: 1024

duckdb:
  path: /app/data/analysis.duckdb

python-executor:
  url: ${PYTHON_EXECUTOR_URL:http://python-executor:8000}
  timeout: 30000

upload:
  path: /app/uploads

app:
  jwtSecret: ${JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1jaGFuZ2UtbWUtYmVmb3JlLXByb2Q=}
  jwtExpirationMs: 86400000
