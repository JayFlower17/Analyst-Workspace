server:
  port: 8080

spring:
  application:
    name: data-analysis-platform
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  ai:
    openai:
      api-key: ${MOONSHOT_API_KEY}
      base-url: https://api.moonshot.cn/v1
      chat:
        options:
          model: kimi-k2-turbo-preview
          temperature: 0.3

duckdb:
  path: /app/data/analysis.duckdb

python-executor:
  url: ${PYTHON_EXECUTOR_URL:http://python-executor:8000}
  timeout: 30000

upload:
  path: /app/uploads
