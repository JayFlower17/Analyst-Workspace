services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: analyst-workspace-postgres
    environment:
      POSTGRES_DB: analyst_workspace
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d analyst_workspace"]
      interval: 10s
      timeout: 5s
      retries: 5
